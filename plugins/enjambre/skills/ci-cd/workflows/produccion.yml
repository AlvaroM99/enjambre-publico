# Despliegue a producción: SOLO manual y SOLO el propietario del repositorio. Ningún agente lo dispara.
# GitHub Free en repos privados no tiene entornos con revisor obligatorio: la condición sobre github.actor,
# la confirmación escrita y la rama main son la barrera (ADR 0001 y 0005). Skill ci-cd de Enjambre.
name: produccion

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe DESPLEGAR para confirmar"
        required: true

permissions:
  contents: read

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  desplegar:
    if: github.actor == github.repository_owner && inputs.confirmar == 'DESPLEGAR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check --if-present
      - run: npm test --if-present
      - name: Desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Cómo volver atrás
        if: always()
        run: echo "Para volver atrás, Álvaro ejecuta en local npx wrangler rollback (procedimiento en la documentación del proyecto)." >> "$GITHUB_STEP_SUMMARY"
