# Banco de evaluaciones de Enjambre (S28, ADR 0008): ejecuta evals/ejecutar.mjs en un runner efímero con la CLI de
# Claude Code fijada y el token del plan de Álvaro. Solo a mano y solo el propietario. Los resultados quedan como
# artefacto del run y en el resumen; no se suben al repositorio.
name: evals

on:
  workflow_dispatch:
    inputs:
      tarea:
        description: 'Id de una tarea de evals/tareas.json (vacío = las 20)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLAUDE_CODE_VERSION: 2.1.330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar la CLI de Claude Code (versión fijada)
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: Ejecutar el banco
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TAREA: ${{ inputs.tarea }}
        run: |
          if [ -n "$TAREA" ]; then
            node evals/ejecutar.mjs --tarea "$TAREA"
          else
            node evals/ejecutar.mjs
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evals-resultados
          path: evals/resultados/
          if-no-files-found: ignore
          retention-days: 90
