<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Hive · enjambre en vivo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l11 6.5v13L16 29 5 22.5v-13z' fill='%23f2a93b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/panel.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="shell" id="app" hidden>
    <aside class="lateral">
      <div class="marca">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l11 6.5v13L16 29 5 22.5v-13z"/><path class="interior" d="M16 10l5 3v6l-5 3-5-3v-6z"/></svg>
        <div><b>Hive</b><span>enjambre en vivo</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="Vistas"></nav>
      <button type="button" class="boton nueva" id="nueva-issue" title="Nueva issue (n)">+ Nueva issue</button>
      <div class="salud" aria-live="polite">
        <span class="pulso" id="conexion">Conectando…</span>
        <span id="ultimo-webhook"></span>
        <span id="conciliacion"></span>
        <span id="limite-api"></span>
        <button type="button" class="enlace" id="conciliar">Conciliar ahora</button>
      </div>
      <div class="usuario">
        <span id="login"></span>
        <span class="botones-usuario">
          <button type="button" class="icono-boton" id="avisos-navegador" aria-label="Avisos del navegador" aria-pressed="false"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M6 16V11a6 6 0 1112 0v5l2 2H4zM10 20a2 2 0 004 0"/></svg></button>
          <button type="button" class="icono-boton" id="tema" aria-label="Cambiar tema claro u oscuro"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6L4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 7a5 5 0 100 10 5 5 0 000-10z"/></svg></button>
          <button type="button" class="enlace" id="salir">Salir</button>
        </span>
      </div>
    </aside>

    <main class="principal">
      <header class="cabecera">
        <h1 id="titulo-vista">En vivo</h1>
        <label class="buscar">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5"/></svg>
          <input type="search" id="busqueda" placeholder="Buscar issues, PR, eventos  ( / )" aria-label="Buscar">
        </label>
        <nav class="filtros" id="filtros" aria-label="Repositorios"></nav>
      </header>
      <p class="aviso" id="error-github" hidden></p>
      <div id="vista" class="vista" tabindex="-1"></div>
    </main>
  </div>

  <section class="entrar" id="entrar" hidden>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l11 6.5v13L16 29 5 22.5v-13z"/><path class="interior" d="M16 10l5 3v6l-5 3-5-3v-6z"/></svg>
    <h1>Hive</h1>
    <p>Tus agentes trabajando en tus repos, al instante. Planifica, aprueba, revisa y fusiona sin salir de aquí.</p>
    <a class="boton" href="/login">Entrar con GitHub</a>
  </section>

  <aside class="cajon" id="cajon" hidden aria-modal="true" role="dialog" aria-labelledby="cajon-titulo">
    <div class="cajon-cab">
      <h2 id="cajon-titulo">Detalle</h2>
      <button type="button" class="cerrar" id="cerrar-cajon" aria-label="Cerrar">×</button>
    </div>
    <div class="cajon-cuerpo" id="cajon-cuerpo"></div>
  </aside>
  <div class="velo" id="velo" hidden></div>
  <div class="avisos" id="avisos" aria-live="assertive"></div>
</body>
</html>
